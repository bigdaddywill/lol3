name: LOL3 persistent executor audit

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "tools/agent_supervisor.py"
      - "tests/test_agent_supervisor.py"
      - "requirements.txt"
      - ".github/workflows/agent-brain-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lol3-agent-watchdog
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run stale-lease watchdog
        run: python tools/agent_supervisor.py watchdog

      - name: Run executor self-test
        run: python tools/agent_supervisor.py self-test

      - name: Run executor unit tests
        run: python -m pytest -q tests/test_agent_supervisor.py

      - name: Persist watchdog recovery
        shell: bash
        run: |
          if git diff --quiet -- agent/STATE.json agent/QUEUE.json agent/LEDGER.md; then
            echo "No watchdog state changes to persist."
            exit 0
          fi

          git config user.name "lol3-agent-watchdog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/STATE.json agent/QUEUE.json agent/LEDGER.md
          git commit -m "chore(agent): persist watchdog recovery"
          git push
