name: LOL3 persistent executor audit

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "tools/agent_supervisor.py"
      - "tests/test_agent_supervisor.py"
      - ".github/workflows/agent-brain-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run executor self-test
        run: python tools/agent_supervisor.py self-test

      - name: Run executor unit tests
        run: python -m pytest -q tests/test_agent_supervisor.py
