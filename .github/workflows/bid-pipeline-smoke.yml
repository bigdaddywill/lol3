name: LOL3 bid pipeline smoke

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "tests/**"
      - "hi"
      - "*.eml"
      - ".github/workflows/bid-pipeline-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run reference end-to-end pipeline
        run: |
          python -m pipeline.bid_pipeline \
            --contractors hi \
            --source "[Concrete _ Indiana] 8 open bids last 14 days — nearest deadline Aug 25, 2026.eml" \
            --output artifacts/bid_pipeline.json

      - name: Validate output invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("artifacts/bid_pipeline.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["bid_count"] == 8, data["bid_count"]
          assert data["contractor_count"] == 263, data["contractor_count"]
          assert len(data["results"]) == data["bid_count"]
          for result in data["results"]:
              assert result["bid"]["source_url"]
              for item in result["matches"]:
                  assert item["contractor"]["business_name"]
                  assert item["match"]["reasons"]
                  assert item["match"]["score_breakdown"]
                  for key in ("bid_invitation", "email_subject", "email_body", "follow_up_sms"):
                      assert item["outreach"][key]
          print("output invariants: PASS")
          PY

      - name: Live Indiana Armory Board scrape
        run: |
          python - <<'PY'
          import re
          from pipeline.bid_pipeline import scrape_url
          from pipeline.live_sources import parse_sab_bids

          raw = scrape_url("https://www.in.gov/apps/sab/bidsystem/sab_bviewer")
          normalized = re.sub(r"\s+", " ", raw)
          assert "Bid Posting" in raw
          assert "Project" in raw and "Number" in raw
          bids = parse_sab_bids(raw)

          if bids:
              print(f"live_sab_bids={len(bids)}")
              for bid in bids[:10]:
                  print(bid["solicitation"], "|", bid["project_name"], "|", bid["deadline"], "|", bid["poc_email"])
          else:
              assert "No Bids Posted at This Time" in normalized, "Unexpected empty Armory Board response"
              print("live_sab_bids=0 (source explicitly reports no bids currently posted)")
          PY

      - name: Upload pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: lol3-bid-pipeline-smoke
          path: artifacts/bid_pipeline.json
