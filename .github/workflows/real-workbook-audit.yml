name: real-workbook-audit
on:
  workflow_dispatch:
  push:
    branches: [packet-automation]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packet-automation
          fetch-depth: 1
      - name: Fetch source workbook from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:Spanish_cleaned_after_152_on_Leads_Magnet.xlsx > Spanish_cleaned_after_152_on_Leads_Magnet.xlsx
          test -s Spanish_cleaned_after_152_on_Leads_Magnet.xlsx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: |
          python -m pip install -U pytest openpyxl
          PYTHONPATH=. pytest -q
      - name: Diagnose public search access
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import quote_plus
          for host in [
              "https://www.google.com/search?q=" + quote_plus('site:govtribe.com/opportunity roofing Massachusetts 2026') + "&num=10&hl=en",
              "https://www.bing.com/search?q=" + quote_plus("site:govtribe.com/opportunity roofing Massachusetts 2026"),
              "https://html.duckduckgo.com/html/?q=" + quote_plus("site:govtribe.com/opportunity roofing Massachusetts 2026"),
          ]:
              try:
                  req = Request(host, headers={"User-Agent": "Mozilla/5.0"})
                  with urlopen(req, timeout=15) as r:
                      body = r.read(50000)
                      print("URL", host)
                      print("STATUS", r.status)
                      print("FINAL", r.geturl())
                      print("BYTES", len(body))
                      print("HEAD", body[:500].decode("utf-8", "replace"))
              except Exception as exc:
                  print("URL", host)
                  print("ERROR", repr(exc))
          PY
      - name: Audit real workbook
        run: |
          mkdir -p audit
          python pipeline.py inspect-workbook --input Spanish_cleaned_after_152_on_Leads_Magnet.xlsx > audit/contractor_audit.json
      - name: Run controlled live discovery
        run: |
          python pipeline.py run --input Spanish_cleaned_after_152_on_Leads_Magnet.xlsx --limit 3 --max-results 5 --minimum-score 30 --related-count 1 --output audit/real_run
          test -f audit/real_run/manifest.json
          cp audit/real_run/manifest.json audit/real_run_manifest.json
      - name: Commit audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit
          git diff --cached --quiet || (git commit -m "Record real workbook audit" && git push origin packet-automation)
